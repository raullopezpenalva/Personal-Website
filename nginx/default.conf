# Select error language from the original request, including after an internal redirect.
map $request_uri $seo_error_language {
    default en;
    ~^/es(?:[/?]|$) es;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Preserve 404 status while serving a useful, nonindexable error document.
    error_page 404 /_errors/$seo_error_language.html;

    location = / { try_files /index.html =404; }
    location = /index.html { return 308 /$is_args$args; }

    location = /robots.txt {
        types { }
        default_type text/plain;
        try_files $uri =404;
    }
    location = /sitemap.xml {
        types { }
        default_type application/xml;
        try_files $uri =404;
    }

    # Build documents and test manifest must not become public URL aliases.
    location ^~ /_pages/ { internal; }
    location ^~ /_errors/ { internal; }
    location ^~ /_seo/ { return 404; }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ^~ /images/ { try_files $uri =404; }

    # Canonical extensionless paths have no trailing slash; retain query strings.
    location ~ ^(.+)/$ {
        # Normalize only existing routes; unknown paths remain real 404s.
        if (-f $document_root/_pages$1.html) {
            return 308 $1$is_args$args;
        }
        return 404;
    }

    # No global SPA fallback: only files generated from the route registry exist.
    location / { try_files /_pages$uri.html =404; }
}
